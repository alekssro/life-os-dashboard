apiVersion: v1
kind: ConfigMap
metadata:
  name: lifeos-config
  namespace: lifeos
data:
  NODE_ENV: "production"
  PORT: "3000"
  AI_PROVIDER: "auto"
  OLLAMA_BASE_URL: "http://ollama.lifeos.svc.cluster.local:11434"
  OLLAMA_MODEL: "llama3.2"
  GEMINI_MODEL: "gemini-1.5-flash"
  ANTHROPIC_MODEL: "claude-3-5-haiku-20241022"
  OPENAI_MODEL: "gpt-4o-mini"
  SEED_ON_BOOT: "false"
