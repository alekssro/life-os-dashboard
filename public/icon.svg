<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #F7F4EB; } /* Cream --paper-bg */
      .paper-text { fill: #2B2625; } /* Dark warm --paper-text */
      .paper-accent { fill: #B84A39; } /* Terracotta --paper-accent */
      .stroke-text-main { fill: none; stroke: #2B2625; stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; }
      .stroke-text-thin { fill: none; stroke: #2B2625; stroke-width: 4; stroke-linecap: round; opacity: 0.6; }
      .stroke-dash { fill: none; stroke: #2B2625; stroke-width: 3; stroke-dasharray: 6 6; opacity: 0.4; }
    </style>
  </defs>

  <!-- App Icon Background Container -->
  <rect class="bg" width="512" height="512" rx="110" />

  <!-- Outer Rounded Frame Border -->
  <rect class="stroke-text-main" x="16" y="16" width="480" height="480" rx="98" stroke-width="12" />

  <!-- Diagonal Guidelines -->
  <line class="stroke-dash" x1="100" y1="100" x2="412" y2="412" />
  <line class="stroke-dash" x1="412" y1="100" x2="100" y2="412" />

  <!-- Outer Ring & Dial Ticks -->
  <circle class="stroke-text-main" cx="256" cy="256" r="160" />
  <circle class="stroke-text-thin" cx="256" cy="256" r="142" />

  <!-- Cardinal Indicators (N / S / E / W) -->
  <polygon class="paper-text" points="256,70 246,88 266,88" />
  <polygon class="paper-text" points="256,442 246,424 266,424" />
  <polygon class="paper-text" points="442,256 424,246 424,266" />
  <polygon class="paper-text" points="70,256 88,246 88,266" />

  <!-- Minor Compass Rose Points (East / West / South) -->
  <polygon class="paper-text" points="256,256 256,380 232,256" />
  <polygon class="paper-text" points="256,256 380,256 256,280" />
  <polygon class="paper-text" points="256,256 132,256 256,232" />

  <!-- Subtle Outline Outers for Compass Rose -->
  <polygon class="stroke-text-thin" points="256,256 256,380 280,256" />
  <polygon class="stroke-text-thin" points="256,256 380,256 256,232" />
  <polygon class="stroke-text-thin" points="256,256 132,256 256,280" />

  <!-- North Needle in Terracotta Accent -->
  <polygon class="paper-accent" points="256,256 256,120 226,256" />
  <polygon class="paper-accent" points="256,256 256,120 286,256" opacity="0.85" />

  <!-- Inner Orbit Ring -->
  <circle class="stroke-text-thin" cx="256" cy="256" r="90" />

  <!-- Central Core Center Cap -->
  <circle fill="#F7F4EB" cx="256" cy="256" r="26" />
  <circle class="stroke-text-main" cx="256" cy="256" r="26" stroke-width="8" />
  <circle class="paper-text" cx="256" cy="256" r="12" />
</svg>
