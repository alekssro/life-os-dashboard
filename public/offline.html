<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - Life OS</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #f8f9fa;
      color: #1a1a2e;
      padding: 20px;
      text-align: center;
    }
    .container {
      max-width: 400px;
      background: white;
      border-radius: 16px;
      padding: 40px 30px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }
    .icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 24px;
      background: linear-gradient(135deg, #4A6FA5 0%, #6B8FC7 100%);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon svg { width: 40px; height: 40px; color: white; }
    h1 { font-size: 24px; font-weight: 600; margin-bottom: 12px; }
    p { font-size: 16px; color: #6b7280; line-height: 1.5; margin-bottom: 24px; }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 20px;
      background: #fef3c7;
      border-radius: 8px;
      font-size: 14px;
      color: #92400e;
      margin-bottom: 24px;
    }
    .status::before {
      content: '';
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #f59e0b;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    .features {
      text-align: left;
      margin: 24px 0;
      padding: 0 16px;
    }
    .features h3 { font-size: 14px; font-weight: 600; margin-bottom: 12px; color: #374151; }
    .features ul { list-style: none; }
    .features li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      font-size: 14px;
      color: #4b5563;
    }
    .features li::before {
      content: '✓';
      color: #10b981;
      font-weight: bold;
    }
    button {
      width: 100%;
      padding: 14px;
      background: #4A6FA5;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #3d5d8a; }
    button:disabled { background: #9ca3af; cursor: not-allowed; }
    .sync-info { font-size: 12px; color: #9ca3af; margin-top: 16px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636l-3.536 3.536m0 5.656l3.536 3.536M9.172 9.172L5.636 5.636m3.536 9.192l-3.536 3.536M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-5 0a4 4 0 11-8 0 4 4 0 018 0z"/>
      </svg>
    </div>
    <h1>You're Offline</h1>
    <p>Life OS works offline! Your changes will sync when you're back online.</p>
    <div class="status">Checking connection...</div>
    <div class="features">
      <h3>Available offline:</h3>
      <ul>
        <li>View tasks, routines, projects</li>
        <li>Create new items</li>
        <li>Mark tasks complete</li>
        <li>Edit existing items</li>
      </ul>
    </div>
    <button id="retryBtn" onclick="checkConnection()">Try Reconnecting</button>
    <div class="sync-info" id="syncInfo"></div>
  </div>

  <script>
    const statusEl = document.querySelector('.status');
    const retryBtn = document.getElementById('retryBtn');
    const syncInfo = document.getElementById('syncInfo');

    async function checkConnection() {
      retryBtn.disabled = true;
      retryBtn.textContent = 'Checking...';
      statusEl.textContent = 'Checking connection...';
      statusEl.style.background = '#fef3c7';
      statusEl.style.color = '#92400e';

      try {
        const res = await fetch('/', { method: 'HEAD', cache: 'no-cache' });
        if (res.ok) {
          statusEl.textContent = 'Online! Redirecting...';
          statusEl.style.background = '#d1fae5';
          statusEl.style.color = '#065f46';
          statusEl.querySelector('::before')?.style.setProperty('background', '#10b981');
          setTimeout(() => window.location.reload(), 1000);
        } else {
          throw new Error('Not ok');
        }
      } catch {
        statusEl.textContent = 'Still offline — will retry automatically';
        statusEl.style.background = '#fee2e2';
        statusEl.style.color = '#991b1b';
        retryBtn.disabled = false;
        retryBtn.textContent = 'Try Reconnecting';
      }
    }

    // Auto-check every 30 seconds
    setInterval(checkConnection, 30000);

    // Listen for sync events from service worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.addEventListener('message', (event) => {
        if (event.data.type === 'mutations-synced') {
          syncInfo.textContent = `Synced ${event.data.data.count} change(s) while you were offline.`;
        }
      });
    }

    // Initial check
    checkConnection();
  </script>
</body>
</html>
