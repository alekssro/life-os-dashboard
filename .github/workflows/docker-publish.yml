name: Build and Push Docker Image

# An image is only built when a release is made:
#   - a GitHub Release is published, or
#   - the Auto Release workflow dispatches `docker-build-trigger`, or
#   - a maintainer runs this workflow manually (workflow_dispatch).
# Plain pushes to main and pull requests do NOT build or publish an image.
on:
  release:
    types: [published]
  repository_dispatch:
    types: [docker-build-trigger]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine version from release, dispatch, or package.json
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            # Extract version from the published release tag (e.g., v1.1.0 -> 1.1.0)
            VERSION="${{ github.event.release.tag_name }}"
            VERSION="${VERSION#v}"
          elif [[ "${{ github.event_name }}" == "repository_dispatch" ]]; then
            # Extract version from dispatch payload
            VERSION="${{ github.event.client_payload.version }}"
          else
            # Manual run: fall back to the package.json version
            VERSION=$(node -p "require('./package.json').version")
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Extract metadata (semantic versioning)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.VERSION }}
            type=raw,value=v${{ steps.version.outputs.VERSION }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attach package to GitHub Release
        if: github.event_name == 'release' || github.event_name == 'repository_dispatch'
        uses: actions/github-script@v7
        with:
          script: |
            const version = "${{ steps.version.outputs.VERSION }}";
            const tag =
              "${{ github.event_name }}" === "release"
                ? "${{ github.event.release.tag_name }}"
                : `v${version}`;
            const packageUrl = `https://ghcr.io/${{ github.repository }}`;

            try {
              const release = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });

              const packageInfo = `\n## Docker Images\n\`\`\`bash\ndocker pull ghcr.io/${{ github.repository }}:latest\ndocker pull ghcr.io/${{ github.repository }}:${version}\ndocker pull ghcr.io/${{ github.repository }}:v${version}\n\`\`\`\n\n**Package:** ${packageUrl}`;

              await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.data.id,
                body: release.data.body + packageInfo,
              });
            } catch (error) {
              core.warning(`Could not attach package info to release ${tag}: ${error.message}`);
            }

      - name: Output image digest
        run: echo "Image pushed with digest ${{ steps.build.outputs.digest }}"
