name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
  release:
    types: [published]
  repository_dispatch:
    types: [docker-build-trigger]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine version from tag, release, or dispatch
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == refs/tags/v* ]]; then
            # Extract version from tag (e.g., v1.1.0 -> 1.1.0)
            VERSION="${GITHUB_REF#refs/tags/v}"
          elif [[ "${{ github.event_name }}" == "release" ]]; then
            # Extract version from release tag
            VERSION="${{ github.event.release.tag_name }}"
            VERSION="${VERSION#v}"
          elif [[ "${{ github.event_name }}" == "repository_dispatch" ]]; then
            # Extract version from dispatch payload
            VERSION="${{ github.event.client_payload.version }}"
          else
            # Fallback to package.json for branch pushes
            VERSION=$(node -p "require('./package.json').version")
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Extract metadata for tag push (semantic versioning)
        id: meta-tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.VERSION }}
            type=raw,value=v${{ steps.version.outputs.VERSION }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Extract metadata for branch push (dev image)
        id: meta-branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=dev
            type=sha,prefix=sha-

      - name: Extract metadata for PR (no push)
        id: meta-pr
        if: github.event_name == 'pull_request'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=pr-${{ github.event.number }}
            type=sha,prefix=sha-

      - name: Build and push Docker image (tag/release)
        id: build-tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-tag.outputs.tags }}
          labels: ${{ steps.meta-tag.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Docker image (branch push)
        id: build-branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-branch.outputs.tags }}
          labels: ${{ steps.meta-branch.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Docker image (PR)
        id: build-pr
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          tags: ${{ steps.meta-pr.outputs.tags }}
          labels: ${{ steps.meta-pr.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attach package to GitHub Release
        if: github.event_name == 'release' && github.event.action == 'published'
        uses: actions/github-script@v7
        with:
          script: |
            const packageName = '${{ env.IMAGE_NAME }}'.toLowerCase();
            const version = '${{ steps.version.outputs.VERSION }}';
            const registry = '${{ env.REGISTRY }}';
            
            // Get the release
            const release = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: '${{ github.event.release.tag_name }}'
            });
            
            // Create release asset note with package info
            const packageUrl = `https://${registry}/${packageName}`;
            const body = release.data.body || '';
            const packageInfo = `\n## Docker Images\n\n\`\`\`bash\n# Latest release\ndocker pull ${registry}/${packageName}:latest\n\ndocker pull ${registry}/${packageName}:${version}\n\ndocker pull ${registry}/${packageName}:v${version}\n\`\`\`\n\n**Package:** ${packageUrl}`;
            
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.data.id,
              body: body + packageInfo
            });

      - name: Output image digest
        if: github.event_name != 'pull_request'
        run: |
          if [ "${{ steps.build-tag.outputs.digest }}" != "" ]; then
            echo "Image pushed with digest ${{ steps.build-tag.outputs.digest }}"
          else
            echo "Image pushed with digest ${{ steps.build-branch.outputs.digest }}"
          fi
